# 修正 Vim 模式切换延迟 (至关重要！)
# 默认 Tmux 等待 ESC 键的时间太长，会导致 Vim 切换模式卡顿
set -sg escape-time 10

set -g word-separators "!\"#$%&'()*+,/:;<=>?@[]^`{|}~ \t"

# 开启真彩色支持
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"

# 前缀键
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# 启用鼠标
set -g mouse on

# 状态栏
set -g status-position top
set -g status-justify left          # 状态栏左对齐
set -g status-left-length 40        # 左侧状态栏长度
set -g status-right-length 120      # 右侧状态栏长度
set -g status-right '#{prefix_highlight} %Y-%m-%d %H:%M'  # 右侧显示时间

# 窗口
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
setw -g window-status-format '#I:#{b:pane_current_path}'
setw -g window-status-current-format '#[fg=colour9,bold][#I:#{b:pane_current_path}]'

# 面板
set -g pane-border-style fg=colour67
set -g pane-active-border-style fg=colour67
bind v split-window -h -p 40 -c '#{pane_current_path}'
bind s split-window -v -p 30 -c '#{pane_current_path}'
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R
bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5

# 加载配置
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
