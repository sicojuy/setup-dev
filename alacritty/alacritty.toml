
[env]
TERM = "xterm-256color"

[window]
#decorations = "buttonless"
dynamic_padding = false
opacity = 1

[window.padding]
x = 10
y = 10

[font]
size = 16.0

[font.bold]
family = "SauceCodePro Nerd Font"
style = "Heavy"

[font.bold_italic]
family = "SauceCodePro Nerd Font"
style = "Heavy Italic"

[font.italic]
family = "SauceCodePro Nerd Font"
style = "Medium Italic"

[font.normal]
family = "SauceCodePro Nerd Font"
style = "Medium"

[selection]
semantic_escape_chars = "!\"#$%&'()*+,/:;<=>?@[]^`{|}~ \t"

[general]
live_config_reload = true
import = [
    "~/.config/alacritty/nightfox.toml"
]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[colors.selection]
text = "#f0f0f0"
background = "#2d5a9e"
